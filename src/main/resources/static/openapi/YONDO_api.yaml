openapi: 3.0.3
info:
  title: KCC API
  description: |
    RESTful API 설계 가이드에 맞춰 수정된 사용자 인증/정보 관련 API 명세
    (로그인, 로그아웃, 비밀번호 초기화, 회원가입, 회원정보 수정, 토큰 재발급 등)
    + 확장: 트레이너 배정 ON/OFF, 일일 이용권 안내, PT 스케줄 관리, 직원 공지사항
  version: "1.0.0"

servers:
  - url: http://202.31.147.127:9345
    description: 서버 (개발용)

paths:
  ########################################
  # 1) 로그인: POST /api/auth/signin
  ########################################
  /api/auth/signin:
    post:
      summary: "로그인 (JWT 발급)"
      description: |
        * 사용자 식별자(`identifier`)와 비밀번호(`password`)를 받아 인증 후 JWT 토큰 발급.
        * 성공 시 사용자 정보(`user`)와 `token`을 함께 반환.
      operationId: login
      requestBody:
        required: true
        description: "로그인에 필요한 JSON 데이터"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
            examples:
              normal:
                summary: "정상 입력 예시"
                value:
                  identifier: "manager1"
                  password: "managerpass1"
              missingIdentifier:
                summary: "identifier 누락"
                value:
                  password: "managerpass1"
              missingPassword:
                summary: "비밀번호 누락"
                value:
                  identifier: "manager1"
      responses:
        "200":
          description: "로그인 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1Ni..."
                  user:
                    type: object
                    example:
                      id: 1
                      identifier: "testUser"
                      name: "홍길동"
              examples:
                success:
                  summary: "로그인 성공 예시"
                  value:
                    status: 200
                    success: true
                    token: "eyJhbGciOiJIUzI1Ni..."
                    user:
                      id: 1
                      identifier: "testUser"
                      name: "홍길동"
        "401":
          description: "로그인 실패 (자격 증명 불일치)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  summary: "아이디 또는 비밀번호 불일치로 인한 실패"
                  value:
                    status: 401
                    success: false
                    message: "로그인 실패"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: "로그아웃"
      description: |
        * 헤더나 바디로 사용자 식별자·토큰 정보를 받아 세션(Refresh Token) 무효화 등 로그아웃 처리.
        * 필요에 따라 `identifier`를 바디로 받거나, 클라이언트에 저장된 Refresh Token을 삭제할 수도 있습니다.
      operationId: logout
      requestBody:
        required: false
        description: "로그아웃에 필요한 JSON 데이터(선택)"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignOutRequest"
            examples:
              normal:
                summary: "정상 로그아웃 예시"
                value:
                  identifier: "testUser"
      responses:
        "200":
          description: "로그아웃 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "로그아웃 성공"
        "500":
          $ref: "#/components/responses/InternalServerError"


  ########################################
  # 2) 회원가입: POST /api/auth/signup
  ########################################
  /api/auth/signup:
    post:
      summary: "회원가입"
      description: |
        * 다양한 사용자 정보를 입력받아 회원가입 진행.
        * 성공 시 새 사용자 리소스가 생성되므로, 일반적으로 201(Created)을 반환함.
        * 아이디(identifier)나 전화번호(콜)가 이미 존재하면 409(CONFLICT) 에러 반환.
      operationId: signUp
      requestBody:
        required: true
        description: "회원가입에 필요한 JSON 데이터"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
            examples:
              normal:
                summary: "정상 회원가입 예시"
                value:
                  identifier: "newUser"
                  password: "mypassword"
                  name: "새 유저"
                  gender: "남"
                  phone: "010-1111-2222"
                  branch: "서울점"
                  birth: "20010304"
                  ntrp: "3.5"
                  career: "3"
                  refundAccount: "110-123-456789"
                  refundBank: "KB국민은행"
                  receiptInfo: "발급"
                  receiptType: "개인"
                  receiptNumber: "3123231212"
                  trainerId: "1223431"
              duplicateIdentifier:
                summary: "이미 존재하는 identifier"
                value:
                  identifier: "testUser"
                  password: "mypassword"
                  name: "기존 유저"
      responses:
        "201":
          description: "회원가입 성공(새로운 사용자 리소스 생성)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "회원가입 성공"
              examples:
                success:
                  summary: "회원가입 성공 예시"
                  value:
                    status: 201
                    success: true
                    message: "회원가입 성공"
        "809":
          description: "이미 존재하는 아이디"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicateIdentifier:
                  summary: "이미 존재하는 아이디"
                  value:
                    status: 809
                    success: false
                    message: "이미 존재하는 아이디입니다."
        "808":
          description: "이미 존재하는 전화번호"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicatePhone:
                  summary: "이미 존재하는 전화번호"
                  value:
                    status: 808
                    success: false
                    message: "이미 존재하는 전화번호입니다"
        "500":
          $ref: "#/components/responses/InternalServerError"


  ########################################
  # 3) 회원정보 수정: PATCH /api/users/modify-info
  ########################################
  /api/users/modify-info:
    patch:
      summary: "회원 정보 수정"
      description: |
        * 사용자를 토큰에서 추출하여 
        * 기본적으로 `password`, `refund_account`, `receiptInfo`, `refund_bank`만 수정 가능.
        * 관리자인 경우 더 많은 필드 수정 가능(예: identifier, name, phone 등).
        * 권한 없는 필드 수정 요청 시 403 오류.
      operationId: modifyInfo
      security:
        - bearerAuth: []
      parameters:
      requestBody:
        required: true
        description: "수정할 정보(JSON)"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyInfoRequest"
            examples:
              normal:
                summary: "정상 수정 예시 (일반 사용자)"
                value:
                  password: "newPassword"
                  refund_account: "110-987-654321"
                  receiptInfo: false
                  refund_bank: "우리은행"
              adminEdit:
                summary: "관리자 권한으로 모든 필드를 수정하는 예시"
                value:
                  identifier: "adminCanChangeThis"
                  name: "관리자 수정된 이름"
                  phone: "010-9999-8888"
                  branch: "부산점"
      responses:
        "200":
          description: "수정 완료"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "수정이 완료되었습니다."
        "403":
          description: "권한이 없는 사용자가 제한 필드를 수정하려고 할 경우"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noPermission:
                  summary: "필드 수정 권한 없음"
                  value:
                    status: 403
                    success: false
                    message: "권한이 없습니다"
        "500":
          $ref: "#/components/responses/InternalServerError"


  ########################################
  # 4) 비밀번호 초기화: PATCH /api/users/{identifier}/password
  ########################################
  /api/users/{identifier}/password:
    patch:
      summary: "비밀번호 초기화"
      description: |
        * 식별자(`identifier`) 경로 파라미터와 추가 인증 토큰(임시 코드를 body에) 필요.
        * 헤더에 Access Token을 포함해야 할 수도 있음(서버 정책에 따라).
      operationId: initPassword
      security:
        - bearerAuth: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: "비밀번호를 초기화할 사용자 식별자"
          schema:
            type: string
      requestBody:
        required: true
        description: "비밀번호 초기화를 위한 JSON 데이터(임시 토큰/코드 등)"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitPasswordRequest"
            examples:
              normal:
                summary: "정상 입력 예시"
                value:
                  token: "인증용_임시_토큰_또는_코드"
              missingToken:
                summary: "token 누락"
                value:
                  token: ""
      responses:
        "200":
          description: "비밀번호 초기화 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "비밀번호 초기화 성공"
        "401":
          description: "비밀번호 초기화 실패 (토큰 불일치 등)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                initFail:
                  summary: "실패 예시"
                  value:
                    status: 401
                    success: false
                    message: "비밀번호 초기화 실패"
        "500":
          $ref: "#/components/responses/InternalServerError"


  ########################################
  # 5) 토큰 재발급: POST /api/tokens/refresh
  ########################################
  /api/tokens/refresh:
    post:
      summary: "Refresh Token을 사용한 Access Token 재발급"
      description: |
        * 만료된 Access Token 갱신을 위해 Refresh Token(RT) 사용.
        * 성공 시 새로운 Access Token(`token`)과 갱신된 Refresh Token(`RT`) 반환.
      operationId: reIssueToken
      requestBody:
        required: true
        description: "토큰 재발급에 필요한 JSON 데이터"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
            examples:
              normal:
                summary: "정상 재발급 요청 예시"
                value:
                  RT: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: "토큰 재발급 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: "새로운 Access Token"
                  RT:
                    type: string
                    example: "갱신된 Refresh Token"
                  message:
                    type: string
                    example: "토큰 재발급 성공"
        "401":
          description: "토큰 재발급 실패 (Refresh Token 검증 실패 등)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                reIssueFail:
                  summary: "Refresh Token 검증 실패"
                  value:
                    status: 401
                    success: false
                    message: "토큰 재발급 실패"
                    code: "T002"
        "500":
          $ref: "#/components/responses/InternalServerError"


  ########################################
  # (추가) 관리자용 API
  # 6) GET /api/admin/modify-info
  ########################################
  /api/admin/modify-info:
    get:
      summary: "관리자가 회원들의 정보를 불러오는 API"
      description: |
        * 예: 전체 사용자 목록 조회, 또는 특정 조건에 맞는 사용자들 조회.
        * 관리자 권한 필요. (SecurityContext에서 ADMIN 여부 확인)
      operationId: adminGetUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "관리자용 사용자 목록 조회 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        identifier:
                          type: string
                          example: "testUser"
                        name:
                          type: string
                          example: "홍길동"
                        phone:
                          type: string
                          example: "010-1234-5678"
                        role:
                          type: string
                          example: "MEMBER"
                example:
                  status: 200
                  success: true
                  data:
                    - identifier: "testUser"
                      name: "홍길동"
                      phone: "010-1234-5678"
                      role: "MEMBER"
                    - identifier: "adminUser"
                      name: "관리자"
                      phone: "010-0000-1111"
                      role: "ADMIN"
        "403":
          description: "권한이 없는 사용자(ADMIN이 아님) 혹은 ban된 사용자"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            examples:
              noAdminPermission:
                summary: "admin 권한 없음"
                value:
                  status: 403
                  success: false
                  message: "권한이 없습니다(관리자 전용)"
        "500":
          $ref: "#/components/responses/InternalServerError"

  ########################################
  # 7) PATCH /api/admin/modify-info/{identifier}
  ########################################
  /api/admin/modify-info/{identifier}:
    patch:
      summary: "관리자가 특정 사용자의 정보를 수정"
      description: |
        * 관리자 권한 필요.
        * Path Param: 수정 대상 식별자
        * RequestBody: 수정할 필드들
      operationId: adminModifyUser
      security:
        - bearerAuth: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: "수정 대상 사용자 식별자"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyInfoRequest"
            examples:
              adminSample:
                summary: "관리자가 사용자 정보 수정 예시"
                value:
                  name: "수정된 이름"
                  phone: "010-9999-8888"
                  role: "TRAINER"
      responses:
        "200":
          description: "수정 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "수정 성공"
        "403":
          description: "권한이 없는 사용자(ADMIN이 아님) 혹은 ban된 사용자"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          examples:
            noAdminPermission:
              summary: "admin 권한 없음"
              value:
                status: 403
                success: false
                message: "권한이 없습니다(관리자 전용)"
        "404":
          description: "대상 사용자를 찾을 수 없음"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          examples:
            userNotFound:
              summary: "존재하지 않는 식별자"
              value:
                status: 404
                success: false
                message: "해당 사용자를 찾을 수 없습니다"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: "관리자가 특정 사용자를 삭제"
      description: |
        * 관리자 권한 필요.
        * Path Param: 삭제 대상 식별자
      operationId: adminDeleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: "삭제 대상 사용자 식별자"
          schema:
            type: string
      responses:
        "200":
          description: "삭제 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "사용자 삭제 완료"
        "403":
          description: "권한이 없는 사용자(ADMIN이 아님) 혹은 ban된 사용자"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            examples:
              noAdminPermission:
                summary: "admin 권한 없음"
                value:
                  status: 403
                  success: false
                  message: "권한이 없습니다(관리자 전용)"
        "404":
          description: "삭제 대상 사용자를 찾을 수 없음"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            examples:
              userNotFound:
                summary: "존재하지 않는 식별자"
                value:
                  status: 404
                  success: false
                  message: "해당 사용자를 찾을 수 없습니다"
        "500":
          $ref: "#/components/responses/InternalServerError"


  ####################################################
  # 8) 트레이너 배정 On/Off 설정: PATCH /api/admin/trainer-assign
  ####################################################
  /api/admin/trainer-assign:
    patch:
      summary: "트레이너 배정 권한 On/Off"
      description: |
        * 관리자 또는 해당 트레이너 본인이 트레이너 배정 가능 상태를 ON/OFF로 설정.
        * 매일 새벽 5시, '배정 ON' 상태 트레이너에게 전날 신규가입 회원들이 랜덤 배정됨.
      operationId: patchTrainerAssign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: "배정 On/Off에 필요한 데이터"
        content:
          application/json:
            schema:
              type: object
              properties:
                trainerId:
                  type: string
                  example: "T1234"
                assignable:
                  type: boolean
                  example: true
            examples:
              turnOn:
                summary: "배정 On 예시"
                value:
                  trainerId: "T1234"
                  assignable: true
              turnOff:
                summary: "배정 Off 예시"
                value:
                  trainerId: "T1234"
                  assignable: false
      responses:
        "200":
          description: "배정 권한 수정 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "트레이너 배정 상태가 변경되었습니다."
        "403":
          description: "권한이 없는 사용자(ADMIN이 아님) 혹은 자기 자신이 아님"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            examples:
              noPermission:
                summary: "본인 또는 관리자 권한이 없음"
                value:
                  status: 403
                  success: false
                  message: "권한이 없습니다"
        "404":
          description: "대상 트레이너를 찾을 수 없음"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            examples:
              trainerNotFound:
                summary: "존재하지 않는 트레이너 ID"
                value:
                  status: 404
                  success: false
                  message: "해당 트레이너를 찾을 수 없습니다"
        "500":
          $ref: "#/components/responses/InternalServerError"


  ####################################################
  # 9) PT (Personal Training) - 회원전용: GET /api/PT/mypt
  ####################################################


  /api/PT/mypt:
      get:
        summary: "회원이 자신의 PT 목록(세션)을 조회"
        description: |
          * 회원이 가진 PT 계약(횟수, 기간), 예약된 스케줄, 담당 트레이너 등의 정보를 조회  
          * ‘회색(예약)’, ‘파랑(완료요청)’, ‘검정(완료)’ 등 상태 정보도 확인 가능
        operationId: getMyPT
        security:
          - bearerAuth: [ ]
        responses:
          "200":
            description: "PT 목록 조회 성공"
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: integer
                      example: 200
                    success:
                      type: boolean
                      example: true
                    pts:
                      type: array
                      items:
                        type: object
                        properties:
                          ptId:
                            type: integer
                            example: 1
                          totalCount:
                            type: integer
                            example: 10
                          usedCount:
                            type: integer
                            example: 2
                          trainerId:
                            type: string
                            example: "trainer1"
                          schedules:
                            type: array
                            items:
                              type: object
                              properties:
                                date:
                                  type: string
                                  format: date
                                  example: "2025-05-20"
                                status:
                                  type: string
                                  example: "예약 | 확인 | 완료 | 취소"
                example:
                  status: 200
                  success: true
                  pts:
                    - ptId: 1
                      totalCount: 10
                      usedCount: 2
                      trainerId: "trainer1"
                      schedules:
                        - date: "2025-05-20"
                          status: "예약"
                        - date: "2025-05-25"
                          status: "확인"
          "401":
            description: "인증 실패 (토큰 오류)"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
          "500":
            $ref: "#/components/responses/InternalServerError"

  /api/PT/mypt/{ptSessionId}:
      get:
        summary: "특정 PT 세션 상세 정보 조회"
        description: |
          * 회원 또는 트레이너가 자신이 가진 PT 세션(단일 세션)에 대한 상세 정보(예: 스케줄, 상태, 남은 횟수 등)를 조회합니다.
        operationId: getMyPTDetail
        security:
          - bearerAuth: [ ]
        parameters:
          - name: ptSessionId
            in: path
            required: true
            description: "세션 식별자 (sessionId)"
            schema:
              type: integer
        responses:
          "200":
            description: "세션 상세 조회 성공"
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: integer
                      example: 200
                    success:
                      type: boolean
                      example: true
                    ptDetail:
                      type: object
                      properties:
                        ptId:
                          type: integer
                          example: 1
                        totalCount:
                          type: integer
                          example: 10
                        usedCount:
                          type: integer
                          example: 2
                        schedules:
                          type: array
                          items:
                            type: object
                            properties:
                              scheduleId:
                                type: integer
                                example: 5
                              date:
                                type: string
                                format: date
                                example: "2025-05-25"
                              status:
                                type: string
                                example: "예약 | 확인 | 완료 | 취소"
                example:
                  status: 200
                  success: true
                  ptDetail:
                    ptId: 1
                    totalCount: 10
                    usedCount: 2
                    schedules:
                      - scheduleId: 5
                        date: "2025-05-25"
                        status: "확인"
          "401":
            description: "인증 실패 (토큰 오류)"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
          "403":
            description: "접근 권한 없음 (소유권 또는 역할/상태 불일치)"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
                examples:
                  forbiddenMember:
                    summary: "회원이 아닌 사용자의 접근"
                    value:
                      status: 403
                      success: false
                      message: "접근 권한이 없습니다."
          "404":
            description: "존재하지 않는 PT 세션"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
          "500":
            $ref: "#/components/responses/InternalServerError"

      patch:
        summary: "특정 PT 세션 업데이트 (확인·취소·완료)"
        description: |
          * **트레이너**는 ‘예약’ 상태의 세션을 **확인**(REQUEST_COMPLETE) 또는 **취소**(CANCEL)할 수 있습니다.  
          * **회원**은 ‘확인’ 상태의 세션을 **완료**(COMPLETE)할 수 있습니다.  
          * 그 외 모든 요청은 **403 Forbidden**.
        operationId: patchMyPTDetail
        security:
          - bearerAuth: [ ]
        parameters:
          - name: ptSessionId
            in: path
            required: true
            description: "수정하려는 세션의 sessionId"
            schema:
              type: integer
        requestBody:
          required: true
          description: "수정할 세션 정보"
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduleId:
                    type: integer
                    example: 5
                  action:
                    type: string
                    enum:
                      - REQUEST_COMPLETE
                      - CANCEL
                      - COMPLETE
                    example: REQUEST_COMPLETE
              examples:
                trainerRequestComplete:
                  summary: "트레이너 확인 처리"
                  value:
                    scheduleId: 5
                    action: REQUEST_COMPLETE
                trainerCancel:
                  summary: "트레이너 예약 취소"
                  value:
                    scheduleId: 5
                    action: CANCEL
                memberComplete:
                  summary: "회원 수업 완료 처리"
                  value:
                    scheduleId: 5
                    action: COMPLETE
        responses:
          "200":
            description: "세션 업데이트 성공"
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: integer
                      example: 200
                    success:
                      type: boolean
                      example: true
                    message:
                      type: string
                      example: "PT 세션 수정 완료"
          "401":
            description: "인증 실패 (토큰 오류)"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
          "403":
            description: "수정 권한 없음 (역할 또는 상태 불일치)"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
                examples:
                  trainerInvalidState:
                    summary: "트레이너가 예약 상태가 아닌 세션 수정 시도"
                    value:
                      status: 403
                      success: false
                      message: "트레이너는 예약 상태에서만 확인(REQUEST_COMPLETE) 또는 취소(CANCEL)할 수 있습니다."
                  memberInvalidState:
                    summary: "회원이 확인 상태가 아닌 세션 완료 시도"
                    value:
                      status: 403
                      success: false
                      message: "회원은 확인 상태에서만 완료(COMPLETE)할 수 있습니다."
          "404":
            description: "존재하지 않는 세션"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
          "500":
            $ref: "#/components/responses/InternalServerError"
    

    ####################################################
  # 10) 직원 공지사항: GET /api/notices/employee
  ####################################################
  /api/notices/employee:
    get:
      summary: "직원 공지사항 조회 API"
      description: |
        - 앱 또는 웹 관리자 페이지에서 직원들에게 제공되는 공지사항 문구를 조회합니다.
        - 일일 이용권 정책, 회원 랜덤 배정, PT 스케줄 안내 등.
        - JWT 인증이 필요합니다. (SecurityContext에서 인증된 사용자만 접근 가능)
      operationId: getEmployeeNotice
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "공지사항 조회 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  notices:
                    type: array
                    items:
                      type: object
                      properties:
                        noticeId:
                          type: integer
                          example: 2
                        title:
                          type: string
                          example: "반갑습니다"
                        content:
                          type: string
                          example: "반가워요"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2025-04-19T15:18:11"
                        author:
                          type: string
                          example: "manager2"
              example:
                status: 200
                success: true
                notices:
                  - noticeId: 2
                    title: "반갑습니다"
                    content: "반가워요"
                    createdAt: "2025-04-19T15:18:11"
                    author: "manager2"
                  - noticeId: 1
                    title: "[공지] 휴일 안내"
                    content: "2025년 9월 22일 ~ 2025년 9월 23일 휴관 안내"
                    createdAt: "2025-04-19T15:03:33"
                    author: "manager1"

        "401":
          description: "인증 실패 (토큰 없음 또는 유효하지 않음)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "로그인이 필요합니다"
        "500":
          description: "서버 내부 오류"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 500
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "공지사항 조회 중 오류가 발생했습니다"
  ####################################################
  # 11) 코트 매칭 API
  ####################################################
  /api/court:
    get:
      summary: "현재 사용자의 NTRP 기반 매칭 룸 조회"
      description: |
        - 로그인한 사용자의 NTRP 등급 기반으로 관련된 코트(매칭 방)를 조회합니다.
        - 예: 비슷한 수준의 유저들과 매칭된 룸 리스트 조회
      operationId: getMatchingRooms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "매칭 룸 조회 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/MatchingRoomDto"
        "401":
          description: "인증 실패 (토큰 없음 또는 만료)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: "새 코트(매칭 룸) 생성"
      operationId: createMatchingRoom
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchingRoomRequest"
      responses:
        "201":
          description: "매칭 룸 생성 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 201 }
                  success: { type: boolean, example: true }
                  message: { type: string, example: "매칭 룸이 생성되었습니다." }
        "400":
          description: "입력값 누락 또는 유효하지 않음"
        "401":
          description: "인증 실패"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      summary: "매칭 룸 정보 수정 (방장 전용)"
      operationId: updateMatchingRoom
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchingRoomRequest"
      responses:
        "200":
          description: "수정 성공"
        "403":
          description: "방장만 수정 가능"
        "404":
          description: "수정할 룸이 없음"
        "401":
          description: "인증 실패"

  /api/court/entrance:
    post:
      summary: "다른 사용자의 매칭 룸 입장"
      operationId: enterMatchingRoom
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchingRoomId:
                  type: integer
                  example: 1
      responses:
        "200":
          description: "입장 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  success: { type: boolean, example: true }
                  message: { type: string, example: "매칭 룸에 입장하였습니다." }
        "403":
          description: "이미 입장한 사용자"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyJoined:
                  summary: "이미 입장한 사용자"
                  value:
                    status: 403
                    success: false
                    message: "이미 입장한 매칭 룸입니다"
        "404":
          description: "매칭 룸 없음"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/court/exit:
    post:
      summary: "매칭 룸 퇴장"
      operationId: exitMatchingRoom
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchingRoomId:
                  type: integer
                  example: 1
      responses:
        "200":
          description: "퇴장 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  success: { type: boolean, example: true }
                  message: { type: string, example: "매칭 룸에서 퇴장하였습니다." }
        "403":
          description: "참여하지 않은 사용자"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notParticipant:
                  summary: "참여하지 않은 사용자"
                  value:
                    status: 403
                    success: false
                    message: "해당 매칭 룸에 참여하고 있지 않습니다"
        "404":
          description: "매칭 룸 없음"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ########################################
    # 요청 스키마들
    ########################################
    SignInRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          example: "testUser"
        password:
          type: string
          format: password
          example: "1234"

    InitPasswordRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: "인증용_임시_토큰_또는_코드"

    SignUpRequest:
      type: object
      required:
        - identifier
        - password
        - name
        - gender
        - phone
        - branch
        - birth
        - ntrp
        - career
        - refundAccount
        - refundBank
        - receiptInfo
        - receiptDetail
        - trainerId
      properties:
        identifier:
          type: string
          example: "newUser"
        password:
          type: string
          format: password
          example: "mypassword"
        name:
          type: string
          example: "홍길동"
        gender:
          type: string
          example: "M"
        phone:
          type: string
          example: "010-1234-5678"
        branch:
          type: string
          example: "서울점"
        birth:
          type: string
          example: "20020304"
        ntrp:
          type: string
          example: "3.5"
        career:
          type: integer
          example: 3
        refundAccount:
          type: string
          example: "110-123-456789"
        refundBank:
          type: string
          example: "KB국민은행"
        receiptInfo:
          type: string
          example: "발급"
        receiptDetail:
          type: string
          example: "개인 : 020304"
        trainerId:
          type: string
          example: "1223431"

    ModifyInfoRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          example: "newPassword"
        refundAccount:
          type: string
          example: "110-987-654321"
        receiptInfo:
          type: string
          example: "발급"
        refundBank:
          type: string
          example: "우리은행"
        phone:
          type: string
          example: "010-9999-8888"
        name:
          type: string
          example: "수정된 이름"
        branch:
          type: string
          example: "부산점"
        role:
          type: string
          example: "TRAINER"
        # 관리자 권한 시 identifier 등 추가 필드 수정 가능

    TokenRefreshRequest:
      type: object
      required:
        - RT
      properties:
        RT:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    SignOutRequest:
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: string
          example: "testUser"

    CreateMatchingRoomRequest:
      type: object
      required: [courtId, type, ntrpMin, ntrpMax, startTime, endTime]
      properties:
        courtId: { type: integer, example: 1 }
        type: { type: string, example: "2인 단식" }
        ntrpMin: { type: number, format: float, example: 3.0 }
        ntrpMax: { type: number, format: float, example: 4.0 }
        startTime: { type: string, format: date-time, example: "2025-06-01T09:00:00" }
        endTime: { type: string, format: date-time, example: "2025-06-01T10:00:00" }
        onOffFlag: { type: boolean, example: true }

    UpdateMatchingRoomRequest:
      type: object
      required: [matchingRoomId]
      properties:
        matchingRoomId: { type: integer, example: 1 }
        type: { type: string, example: "2인 단식" }
        ntrpMin: { type: number, format: float, example: 3.0 }
        ntrpMax: { type: number, format: float, example: 4.0 }
        startTime: { type: string, format: date-time, example: "2025-06-01T09:00:00" }
        endTime: { type: string, format: date-time, example: "2025-06-01T10:00:00" }
        onOffFlag: { type: boolean, example: true }

    MatchingRoomDto:
      type: object
      properties:
        id: { type: integer, example: 1 }
        hostId: { type: string, example: "trainer1" }
        courtId: { type: integer, example: 1 }
        type: { type: string, example: "2인 단식" }
        ntrpMin: { type: number, example: 3.0 }
        ntrpMax: { type: number, example: 4.0 }
        onOffFlag: { type: boolean, example: true }
        startTime: { type: string, format: date-time, example: "2025-06-01T09:00:00" }
        endTime: { type: string, format: date-time, example: "2025-06-01T10:00:00" }
        createdDate: { type: string, format: date-time, example: "2025-05-18T15:00:00" }


    ########################################
    # 에러 공통 응답 스키마
    ########################################
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 401
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "에러 메시지 내용"
        code:
          type: string
          example: "T001"
      description: "에러 응답 공통 구조"

  ########################################
  # 공통 응답 (서버 오류 등)
  ########################################
  responses:
    InternalServerError:
      description: "서버 내부 오류"
      content:
